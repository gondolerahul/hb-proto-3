<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vihara — the Still Surface (visual concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold-500:#edab48; --gold-700:#a8722a;
  --bg:#0a0908; --surface:#141210; --surface-2:#1c1916;
  --fg:#f6f1e9; --fg-muted:#b3aaa0; --fg-subtle:#7c746b; --fg-faint:#544d46;
  --border-strong:rgba(255,240,220,.16);
  --gradient-gold:linear-gradient(105deg,#fdc871 0%,#edab48 32%,#ffefd8 58%,#fdc871 100%);
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --focus-ring:0 0 0 3px rgba(237,171,72,.32);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 30%, #0e0c0a 0%, #060505 70%);
     color:var(--fg);font-family:var(--font-body);font-weight:300;overflow:hidden;
     -webkit-font-smoothing:antialiased;cursor:default}

/* ── the energy floor, carried over from the legacy app's background system ──
   matte hex tiles over a slow gold glow — light through the gaps, fog at the
   horizon. Re-keyed to the brand's single hue; the legacy blue is retired.  */
.floorwrap{position:fixed;left:50%;bottom:-14vh;width:210vw;height:120vh;z-index:0;
  transform:translateX(-50%) perspective(900px) rotateX(62deg);transform-origin:50% 100%;
  pointer-events:none;opacity:.5}
.floorwrap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top, transparent 0%, rgba(6,5,5,.4) 40%, #060505 90%)}
#floor{width:100%;height:100%;display:block}

/* the dotted-B, the brand's one ornament — watermark, never redrawn */
.watermark{position:fixed;right:-3vw;bottom:-10vh;height:92vh;z-index:0;
  opacity:.05;pointer-events:none}
.watermark svg{height:100%;width:auto}

/* ── depth 0 ── */
.still{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  justify-content:center;padding-left:clamp(32px, 12vw, 220px)}
.still p{margin:0 0 10px;font-size:clamp(19px, 2.2vw, 24px);line-height:1.55;
  color:var(--fg);max-width:36ch}
.still p.sub{color:var(--fg-muted)}
.still p.need{color:var(--fg);font-weight:500}
.still p.need::before{content:"";display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--gradient-gold);margin-right:12px;vertical-align:1px}
.still p.quiet{color:var(--fg-subtle);display:none}
body.allwell .still p.need{display:none}
body.allwell .still p.quiet{display:block}
.deeper{margin-top:44px;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--fg-muted);opacity:0;animation:arrive 1.2s var(--ease-out) 3s forwards}
@keyframes arrive{to{opacity:1}}

.pulse{position:fixed;right:12vw;bottom:16vh;width:10px;height:10px;border-radius:50%;
  background:var(--fg-subtle);opacity:.5;z-index:1}   /* .5 = the breathe midpoint, so
  the reduced-motion rest state is the quiet register, not full brightness */
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:beat 3.4s var(--ease-out) infinite}
  @keyframes beat{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.35)}}
}

/* ── HUD ── */
.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:14px 22px;z-index:10;pointer-events:none}
.hud .mark{width:10px;height:10px;border-radius:50%;background:var(--gradient-gold);flex:none}
.hud .co{font-family:var(--font-display);font-weight:500;font-size:15px}
.hud .right{margin-left:auto;pointer-events:auto}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden}
.seg button{font-family:var(--font-body);font-size:12.5px;font-weight:500;border:0;
  padding:6px 14px;background:transparent;color:var(--fg-muted);cursor:pointer;
  transition:all .18s var(--ease-out)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.seg button:focus-visible{outline:0;box-shadow:var(--focus-ring)}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  font-family:var(--font-body);font-size:12px;color:var(--fg-muted);z-index:10}
.credit{position:fixed;bottom:14px;right:22px;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.12em;color:var(--fg-faint);z-index:10;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.16s!important}
  .deeper{opacity:1}
}
</style>
</head>

  <p class="sub">₹2.4L collected this week.</p>
  <p class="need">Two colleagues are waiting for you.</p>
  <p class="quiet">Nothing needs you.</p>
  <p class="deeper">go deeper · click anywhere</p>
</div>

<div class="hint">This is the home screen — of everything. Silence is the proof the workforce is working.</div>
<div class="credit">vihara · still surface · depth 0 · visual concept</div>

<script>
'use strict';
/* the estate is one level down — "click anywhere" means anywhere but the HUD */
document.body.addEventListener('click', e => {
  if (e.target.closest('.hud')) return;
  location.href = 'estate-visual.html';
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowDown'){
    e.preventDefault(); location.href = 'estate-visual.html';
  }
});
/* the demo toggle: at zero hands raised, no gold on this screen but the brand
   mark (art bible §2.1 — "almost no gold"; the mark and wordmark are sanctioned) */
document.querySelectorAll('#mode button').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('#mode button')
      .forEach(o => o.setAttribute('aria-pressed', String(o === btn)));
    document.body.classList.toggle('allwell', btn.dataset.v === 'allwell');
  });
});

/* ── the energy floor ─────────────────────────────────────────────────── */
(function(){
  const cv = document.getElementById('floor');
  const ctx = cv.getContext('2d');
  const W = 1200, H = 700; cv.width = W; cv.height = H;
  const R = 26, gap = 2.4, SQ3 = Math.sqrt(3);
  const hex = new Path2D();
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i;
    const x = (R - gap) * Math.cos(a), y = (R - gap) * Math.sin(a);
    i ? hex.lineTo(x, y) : hex.moveTo(x, y);
  }
  hex.closePath();
  const cols = Math.ceil(W / (R * 1.5)) + 2, rows = Math.ceil(H / (R * SQ3)) + 2;
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const blobs = [];
  for (let i = 0; i < 7; i++) blobs.push({
    x: rnd() * W, y: rnd() * H, r: 130 + rnd() * 180,
    dx: .3 + rnd() * .7, dy: .25 + rnd() * .6, p: rnd() * 6.28, white: i === 6 });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0;
  function frame(){
    t += .016;
    ctx.fillStyle = '#060505'; ctx.fillRect(0, 0, W, H);
    for (const b of blobs){
      const x = b.x + Math.sin(t * b.dx + b.p) * 150;
      const y = b.y + Math.cos(t * b.dy + b.p) * 95;
      const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
      const c = '246,241,233';   /* light, not signal — the floor spends no gold */
      g.addColorStop(0, `rgba(${c},${b.white ? .26 : .22})`);
      g.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = g; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
    }
    ctx.fillStyle = '#0b0a09';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
      const x = c * R * 1.5, y = r * R * SQ3 + (c % 2 ? R * SQ3 / 2 : 0);
      ctx.save(); ctx.translate(x, y); ctx.fill(hex); ctx.restore();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
