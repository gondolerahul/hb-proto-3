# =============================================================================
# HireBuddha Platform - Security Configuration
# =============================================================================
# Applied globally to all VirtualHosts via a2enconf.
# Provides:
#   1. Security response headers
#   2. Malicious IP blocking (known attackers from log analysis)
#   3. Path-based attack blocking (LFI, credential harvesting, scanner patterns)
#   4. Rate limiting via mod_evasive
#   5. Request size limits
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Security Headers (requires mod_headers)
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(self), geolocation=()"
    # Strip server info from responses
    Header always unset X-Powered-By
    Header always unset Server
</IfModule>

# ---------------------------------------------------------------------------
# 2. Block Known Malicious IPs (from gateway log analysis 2026-03-16)
# ---------------------------------------------------------------------------
# Wrap in <Location "/"> so Require directives are valid in server config.
#
# 195.3.221.86    - Next.js fingerprinting scanner (70+ recurring requests)
# 107.189.12.131  - VoIP/SIP config scanner (80+ unique paths)
# 195.178.110.160 - Credential/secrets harvester (.env, .aws, .git)
# 130.12.180.52   - Open proxy tester (CONNECT requests)
# 204.76.203.215  - Path traversal attacker (LFI /etc/passwd)
# 204.76.203.73   - Path traversal attacker (LFI /etc/passwd)
# 89.42.231.182   - Path traversal attacker (LFI /etc/passwd)
# 193.32.162.28   - Next.js scanner
# 93.123.109.222  - Fingerprinting scanner
# 178.22.106.230  - Asset probing / phishing kit scanner
# ---------------------------------------------------------------------------
<Location "/">
    <RequireAll>
        Require all granted
        Require not ip 195.3.221.86
        Require not ip 107.189.12.131
        Require not ip 195.178.110.160
        Require not ip 130.12.180.52
        Require not ip 204.76.203.215
        Require not ip 204.76.203.73
        Require not ip 89.42.231.182
        Require not ip 193.32.162.28
        Require not ip 93.123.109.222
        Require not ip 178.22.106.230
    </RequireAll>
</Location>

# ---------------------------------------------------------------------------
# 3. Block Malicious Path Patterns (requires mod_rewrite)
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Block path traversal attempts (LFI attacks targeting /etc/passwd, etc.)
    RewriteCond %{REQUEST_URI} \.\.[/\\] [OR]
    RewriteCond %{THE_REQUEST} \.\.
    RewriteRule .* - [F,L]

    # Block open proxy attempts (CONNECT method)
    RewriteCond %{REQUEST_METHOD} ^CONNECT$ [NC]
    RewriteRule .* - [F,L]
</IfModule>

# Block access to hidden files/directories (.env, .git, .aws, .kube, etc.)
<LocationMatch "^/\.">
    Require all denied
</LocationMatch>

# Block .env files in any subdirectory (e.g. /server/.env, /backend/.env)
<LocationMatch "/[^/]*\.env">
    Require all denied
</LocationMatch>

# Block config/credential files that scanners probe for
<LocationMatch "(config\.(json|php|yml)|docker-compose\.yml|credentials|info\.php|phpinfo)$">
    Require all denied
</LocationMatch>

# Block WordPress scanning (this is not a WP site)
<LocationMatch "^/(wp-login|wp-admin|wp-content|wp-includes)">
    Require all denied
</LocationMatch>

# Block VoIP/SIP provisioning scanners
<LocationMatch "^/(firmware|pbxcfg|yealink|cfgvoip|pap2|devicecfg|telephone|aastra|phconfig|asterisks?|cfgs|cfgsip|provision|polycom|snom|voip|tftpboot|cfgvoice|voipprov|sipphone|tftp|cisco|pbx|gigaset|poly|spa|recording|recordings|macconf|grandstram|panasonic|cfgprov|phone|phones)(/|$)">
    Require all denied
</LocationMatch>

# Block config file extensions commonly probed
<LocationMatch "\.(cfg|bak|old|orig|sql|tar|gz|zip|rar|7z)$">
    Require all denied
</LocationMatch>

# Block service discovery / infrastructure probing
<LocationMatch "^/(solr|v2/_catalog|query|actuator|global/health|cgi-bin)">
    Require all denied
</LocationMatch>

# ---------------------------------------------------------------------------
# 4. mod_evasive - Rate Limiting / DDoS Protection
# ---------------------------------------------------------------------------
<IfModule mod_evasive20.c>
    # Max requests to the SAME page per page interval (per IP)
    DOSPageCount        5
    DOSPageInterval     1

    # Max requests to ANY page per site interval (per IP)
    DOSSiteCount        50
    DOSSiteInterval     1

    # How long (seconds) an IP is blocked after triggering limits
    DOSBlockingPeriod   300

    # Log directory for tracking blocked IPs
    DOSLogDir           "/var/log/apache2/mod_evasive"

    # Whitelist localhost and internal network IPs
    DOSWhitelist        127.0.0.1
    DOSWhitelist        10.160.0.*
    DOSWhitelist        172.21.0.*
</IfModule>

# ---------------------------------------------------------------------------
# 5. Request Size Limits (prevent oversized payloads)
# ---------------------------------------------------------------------------
# Limit request body to 10MB (adjust if file uploads need more)
LimitRequestBody 10485760

# Limit request header fields
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestLine 8190
