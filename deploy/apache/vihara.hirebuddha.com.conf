<VirtualHost *:80>
    ServerName vihara.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Long-lived connections: the estate SSE stream (/api/v1/ai/genui/stream)
    # and Pragya's WebSocket channel both stay open for hours.
    ProxyTimeout 86400

    # ===== WebSocket Proxy (MUST come before regular proxy) =====
    RewriteEngine On
    # Pragya's event channel (VG-07) and any other backend WS live under /api
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/api/(.*) ws://127.0.0.1:8000/api/$1 [P,L]
    # Anything else upgrading (Vite HMR while the app is dev-served) → the app
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:4044/$1 [P,L]

    # ===== Regular HTTP Proxy =====
    # /api is same-origin with the app on purpose: Vihara's cookie-mode auth
    # (VP-01 — HttpOnly refresh cookie + CSRF double-submit) requires the API
    # on the app's own origin, exactly as the Vite dev proxy arranges locally.
    ProxyPass /api http://localhost:8000/api
    ProxyPassReverse /api http://localhost:8000/api

    # Everything else → the Vihara app (port 4044, owner decision 2026-07-29)
    ProxyPass / http://localhost:4044/
    ProxyPassReverse / http://localhost:4044/

    ErrorLog ${APACHE_LOG_DIR}/vihara-hirebuddha-error.log
    CustomLog ${APACHE_LOG_DIR}/vihara-hirebuddha-access.log combined
RewriteCond %{SERVER_NAME} =vihara.hirebuddha.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
